<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="300" viewBox="0 0 400 300">
  <style>
    .bg { fill: #1e2533; }
    .badge { stroke: #fff; stroke-width: 3; }
    #title { font-size: 22px; fill: #ffffff; font-weight: bold; }
    g.icons > circle { fill: url(#rg); }
  </style>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="50%" style="stop-color:#ffcc33"/>
      <stop offset="100%" stop-color="rgb(80, 200, 255)" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="rg" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.35">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="#3a7bff"/>
    </radialGradient>
    <linearGradient id="lg2" href="#lg" gradientUnits="userSpaceOnUse" x1="20" y1="200" x2="200" y2="200" spreadMethod="reflect" gradientTransform="rotate(10)"/>
    <clipPath id="clip"><circle cx="320" cy="90" r="50"/></clipPath>
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5-6.5 4.5 2-7.5L2 9h7z"/></symbol>
    <filter id="shadow"><feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>
  <rect class="bg" x="0" y="0" width="400" height="300" rx="24"/>
  <text id="title" x="24" y="40">Vectra SVG</text>
  <rect x="24" y="60" width="160" height="90" rx="16" fill="url(#lg)" filter="url(#shadow)"/>
  <g class="icons" transform="translate(220 60)">
    <circle cx="20" cy="20" r="18" class="badge"/>
    <circle cx="70" cy="20" r="18" class="badge" opacity="0.6"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="270" y="40" width="100" height="100" fill="#ff4d6d"/>
    <rect x="270" y="40" width="50" height="50" fill="#ffd166"/>
    <line x1="270" y1="140" x2="370" y2="40" stroke="#06d6a0" stroke-width="10"/>
  </g>
  <use href="#star" x="24" y="170" width="80" height="80" fill="#ffd166" stroke="#9a5b00" stroke-width="1"/>
  <path d="M120 250 C 150 170, 200 170, 230 250 S 310 330, 340 250" fill="none" stroke="url(#lg2)" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 10"/>
  <polygon points="250,180 290,160 330,180 310,220 270,220" fill="hsl(280, 70%, 60%)" fill-rule="evenodd" transform="rotate(-8 290 190)"/>
  <ellipse cx="370" cy="250" rx="20" ry="35" fill="none" stroke="currentColor" color="#8ecae6" stroke-width="4" stroke-dasharray="4 4"/>
  <svg x="140" y="160" width="60" height="60" viewBox="0 0 10 10"><rect width="10" height="10" fill="#118ab2"/><circle cx="5" cy="5" r="3" fill="#ef476f"/></svg>
</svg>
